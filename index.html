<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>

  <body>
    <div id="all">

      <div id="cambounds">
        <div hidden id="videoCanvas"></div>
      </div>

      <div id="camControls">
        <button onClick="take()" id="cameraButton" disabled>Take Photo</button>
        <input type="checkbox" onclick="toggleCamera()" id="cameraCheckbox">
        <p id="camText" class = "info">Toggle Camera</p>
        
      </div>
      <p id = "indexElement" class = "info" hidden>Photo Number: 1</p>
      <button onClick="removeImage( )" id="removeButton" disabled>Remove Image</button>
      <div id="imgStuff">
        <button onClick="moveIndex(-1)" class="indexButton"> &lt;&lt; </button>
          <div id="imageCanvas"></div>  
        <button onClick="moveIndex(1)" class="indexButton"> &gt;&gt; </button>
      </div>
      

      <button onClick="startClassify()" id="analyzeButton" disabled>
        Analyze
      </button>      
      <p id = "totalScoreElement" class = "info">Total Score: 0</p>

    </div>
    <script src="sketch.js"></script>
  </body>
</html>
